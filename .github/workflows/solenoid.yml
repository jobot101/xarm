# Solenoid tester (solenoid/): builds on its own and publishes ONLY https://jobot101.github.io/xarm/sol/.
# Never rebuilds the arm firmware, so Muffin doesn't auto-update or reboot when the solenoid changes.
# One MOSFET + solenoid on any ESP32-S3. Arduino core 3.x, 4 MB image, no PSRAM, DIO flash so it boots on any
# S3 module; native-USB serial (CDC on boot) for the flasher's boot log. Boards update from the page (Install latest).
name: solenoid

on:
  push:
    branches: [main, "dev/**"]
    paths: [solenoid/**, .github/workflows/solenoid.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solenoid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.cache/arduino
          key: arduino-esp32-3.2.0

      - uses: arduino/setup-arduino-cli@v2
      - name: install esp32 core 3.x
        run: |
          URL=https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index --additional-urls $URL
          arduino-cli core install esp32:esp32@3.2.0 --additional-urls $URL

      - name: compile
        run: |
          set -o pipefail
          echo "#define FW_VERSION \"${GITHUB_SHA::7}\"" > solenoid/version.h
          arduino-cli compile --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,PSRAM=disabled,FlashSize=4M,PartitionScheme=default,FlashMode=dio" \
            --export-binaries --output-dir out solenoid 2>&1 | tee sol.log

      - name: report compile errors
        if: failure()
        run: grep -E "error:|Error" sol.log | head -30 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done

      - name: package
        run: |
          B0=$(find ~/.arduino15 -name boot_app0.bin | head -1)
          d=sol; mkdir -p $d
          cp out/solenoid.ino.bootloader.bin $d/bootloader.bin
          cp out/solenoid.ino.partitions.bin $d/partitions.bin
          cp "$B0" $d/boot_app0.bin
          cp out/solenoid.ino.bin $d/solenoid.bin
          cat > $d/manifest.json <<JSON
          {"name":"solenoid tester","version":"${GITHUB_SHA::7}","builds":[{"chipFamily":"ESP32-S3","parts":[
            {"path":"bootloader.bin","offset":0},{"path":"partitions.bin","offset":32768},
            {"path":"boot_app0.bin","offset":57344},{"path":"solenoid.bin","offset":65536}]}]}
          JSON
          ls -la $d
          echo "::notice::solenoid ${GITHUB_SHA::7}: $(stat -c %s $d/solenoid.bin) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: sol
          path: sol/

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: { group: gh-pages, cancel-in-progress: false }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: sol, path: sol }
      - name: publish sol/ only (rest of the flasher site untouched)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: sol
          destination_dir: sol
          keep_files: true
