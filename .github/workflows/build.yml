# Builds the firmware in the cloud on every push to main and publishes the flash files
# as the "latest" release, so a phone only ever downloads .bin files — it never compiles.
name: build

on:
  push:
    branches: [main, "dev/**"]     # dev/** = compile check only: no release, no Pages, the board never sees it
    paths-ignore: [brain/**, cam/hiwonder/**, .github/workflows/fetch-cam.yml, solenoid/**, .github/workflows/solenoid.yml]
  workflow_dispatch:

permissions:
  contents: write

# a newer push makes an older build pointless (it has all the same changes and more): cancel it, so pushes in a
# row don't run side by side re-recording the same new voice lines
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: build web app (embedded into firmware)
        working-directory: web
        run: python3 ../tools/lessons_json.py && npm ci && npm run build

      - name: host tests
        working-directory: firmware/test
        run: cc -I../main test_core.c ../main/core.c -lm -o t && ./t && cc -I../main test_track.c ../main/track.c -lm -o tt && ./tt

      # voice + bells + organ: rendered offline with Piper (open-source neural TTS) into the sound bank
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      # voice models + every line already voiced (keyed by text + voice), so a build only voices new lines
      - name: voice cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/piper
            ~/.cache/muffin-tts
          key: tts-${{ hashFiles('tools/make_sounds.py') }}
          restore-keys: tts-

      - name: render sound bank
        run: |
          sudo apt-get install -y -qq espeak-ng >/dev/null
          pip install -q -r tools/requirements.txt
          V=$(python3 -c "import sys; sys.path.insert(0,'tools'); import make_sounds as m; print(m.VOICE)")
          case "$V" in kokoro:*) ;; *) python3 -m piper.download_voices "${V#piper:}" --download-dir ~/.cache/piper ;; esac
          python3 tools/make_sounds.py | tail -4

      - name: stamp version (board compares this to manifest.json to auto-update)
        run: echo "${GITHUB_SHA::7}" > firmware/version.txt

      - name: build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          path: firmware
          command: "idf.py build 2>&1 | tee build.log; exit ${PIPESTATUS[0]}"

      # compile errors as annotations, readable through the REST API (check-runs/<id>/annotations)
      - name: report compile errors
        if: failure()
        run: |
          grep -E "error:|undefined reference|FAILED:|CMake Error" firmware/build.log | head -40 | while IFS= read -r l; do
            echo "::error::${l//%/%25}"
          done
          grep -E "error:|undefined reference|CMake Error" -A3 firmware/build.log | head -120 > err.txt || true
          { echo '```'; cat err.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: collect flash files
        run: |
          sudo chown -R "$USER" firmware/build
          B=firmware/build
          mkdir -p release
          cp $B/bootloader/bootloader.bin release/
          cp $B/partition_table/partition-table.bin release/
          cp $B/ota_data_initial.bin release/
          cp $B/xarm-voice.bin release/
          cp $B/srmodels/srmodels.bin release/
          cp firmware/main/sounds.bin release/        # Muffin's voice + bells: flashed after the speech models
          cp firmware/main/sounds_hq.bin release/     # full quality, for the SD card (downloaded by the board, never flashed)
          # offsets straight from the build, so they can't drift
          python3 - <<'EOF'
          import json, os
          B = "firmware/build"
          fa = json.load(open(f"{B}/flasher_args.json"))
          rows = sorted((int(off, 16), os.path.basename(p)) for off, p in fa["flash_files"].items())
          # "model" partition offset + size straight from partitions.csv
          MODEL = next(l.split(",") for l in open("firmware/partitions.csv") if l.startswith("model"))
          sz = lambda x: int(x.strip()[:-1]) << 20 if x.strip().endswith("M") else int(x, 16)
          MODEL_OFF, MODEL_SIZE = int(MODEL[3], 16), sz(MODEL[4])
          BANK_OFF, BANK_MAX = 0x380000, 0x340000                 # FX_BANK_OFF / FX_BANK_MAX in fx.h
          assert BANK_OFF + BANK_MAX <= MODEL_SIZE, "sound bank runs past the model partition"
          if not any(n == "srmodels.bin" for _, n in rows):       # esp-sr may flash it via its own target
              rows.append((MODEL_OFF, "srmodels.bin"))
          rows.append((MODEL_OFF + BANK_OFF, "sounds.bin"))
          sr = os.path.getsize("release/srmodels.bin")
          print(f"srmodels.bin {sr} bytes of {BANK_OFF}")
          assert sr <= BANK_OFF, f"srmodels.bin ({sr} bytes) now runs into the sound bank: raise FX_BANK_OFF in fx.h + here"
          rows.sort()
          import hashlib
          snd = open("release/sounds.bin", "rb").read()
          with open("release/OFFSETS.txt", "w") as f:
              f.write("Flash with https://espressif.github.io/esptool-js/  (add each file at its offset)\n\n")
              for off, name in rows:
                  f.write(f"0x{off:06x}  {name}\n")
          json.dump({
              "name": "xarm-voice", "version": os.environ.get("GITHUB_SHA", "dev")[:7],
              "sounds": hashlib.sha256(snd).hexdigest()[:12], "sounds_size": len(snd),   # board syncs this over WiFi
              "sounds_hq": hashlib.sha256(open("release/sounds_hq.bin", "rb").read()).hexdigest()[:12],
              "sounds_hq_size": os.path.getsize("release/sounds_hq.bin"),
              "new_install_prompt_erase": True,
              "builds": [{"chipFamily": "ESP32-S3",
                          "parts": [{"path": n, "offset": o} for o, n in rows]}],
          }, open("release/manifest.json", "w"), indent=2)
          print(open("release/OFFSETS.txt").read())
          # readable from the phone/API without log access (check-run annotations)
          srb = open("release/srmodels.bin", "rb").read()
          models = sorted({m.decode() for m in __import__("re").findall(rb"(mn\d\w*|vadnet\w*|wn\d+\w*|nsnet\w*)", srb[:8192])})
          app = os.path.getsize("release/xarm-voice.bin")
          print(f"::notice::srmodels.bin {sr} B (limit {BANK_OFF}) models {models}; app {app} B; sounds {len(snd)} B")
          EOF
          ls -la release

      - name: replace previous "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag -y || true

      - name: publish "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest build
          prerelease: true
          make_latest: true
          files: release/*
          body: |
            Built from ${{ github.sha }}.
            Flash from a phone (USB-C): https://jobot101.github.io/xarm/ — one tap, files built in.
            Updates (WiFi): automatic, or http://muffin → Firmware → upload xarm-voice.bin

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/

  # vision module (Hiwonder ESP32-S3 cam): their color sketch, patched (cam/xarm_color), built for both
  # PSRAM types — the phone flasher reads the chip and picks the matching one
  camera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: install esp32 core 2.0.17 (bundles esp-dl's color detector)
        run: |
          URL=https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index --additional-urls $URL
          arduino-cli core install esp32:esp32@2.0.17 --additional-urls $URL
      - name: compile
        run: |
          set -o pipefail
          for v in qspi:enabled opi:opi; do
            name=${v%%:*}; ps=${v#*:}
            arduino-cli compile --fqbn "esp32:esp32:esp32s3:PSRAM=$ps,FlashSize=4M,PartitionScheme=huge_app,FlashMode=qio" \
              --export-binaries --output-dir out/$name cam/xarm_color 2>&1 | tee -a cam.log
          done
      - name: report compile errors
        if: failure()
        run: grep -E "error:|Error" cam.log | head -30 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
      - name: package
        run: |
          B0=$(find ~/.arduino15 -name boot_app0.bin | head -1)
          for name in qspi opi; do
            d=camera/$name; mkdir -p $d
            cp out/$name/xarm_color.ino.bootloader.bin $d/bootloader.bin
            cp out/$name/xarm_color.ino.partitions.bin $d/partitions.bin
            cp "$B0" $d/boot_app0.bin
            cp out/$name/xarm_color.ino.bin $d/camera.bin
            cat > $d/manifest.json <<JSON
          {"name":"xarm camera ($name PSRAM)","version":"${GITHUB_SHA::7}","builds":[{"chipFamily":"ESP32-S3","parts":[
            {"path":"bootloader.bin","offset":0},{"path":"partitions.bin","offset":32768},
            {"path":"boot_app0.bin","offset":57344},{"path":"camera.bin","offset":65536}]}]}
          JSON
          done
          ls -la camera/*
      - uses: actions/upload-artifact@v4
        with:
          name: camera
          path: camera/

  # MotherShip: same board, brain on the shop PC (firmware/main/pc.c + brain/). Built in parallel with Muffin from the same
  # code with sdkconfig.mothership layered on top; published to fw/mothership/ (its own auto-update channel). No sound bank:
  # MotherShip's voice comes from the PC, so the bank is rendered silent just to satisfy the build.
  mothership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: build web app (embedded into firmware)
        working-directory: web
        run: python3 ../tools/lessons_json.py && npm ci && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: silent sound bank (header only matters)
        run: pip install -q numpy scipy && python3 tools/make_sounds.py --no-voice | tail -2
      - name: stamp version, layer the MotherShip settings on the defaults
        run: |
          echo "${GITHUB_SHA::7}" > firmware/version.txt
          cat firmware/sdkconfig.mothership >> firmware/sdkconfig.defaults
      - name: build firmware (MotherShip)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          path: firmware
          command: "idf.py build 2>&1 | tee build.log; exit ${PIPESTATUS[0]}"
      - name: report compile errors
        if: failure()
        run: |
          grep -E "error:|undefined reference|FAILED:|CMake Error" firmware/build.log | head -40 | while IFS= read -r l; do
            echo "::error::${l//%/%25}"
          done
      - name: collect flash files
        run: |
          sudo chown -R "$USER" firmware/build
          grep -q "CONFIG_XARM_MOTHERSHIP=y" firmware/build/../sdkconfig || { echo "::error::MotherShip overlay not applied"; exit 1; }
          grep -q "CONFIG_SCCB_HARDWARE_I2C_DRIVER_NEW=y" firmware/sdkconfig || { echo "::error::camera SCCB on the legacy I2C driver (aborts at boot)"; exit 1; }
          grep -q "CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y" firmware/sdkconfig || { echo "::error::WiFi buffers not in PSRAM"; exit 1; }
          grep -E "CAMERA_DMA|SCCB|WIFI_IRAM_OPT|WIFI_RX_IRAM_OPT|LWIP_IRAM_OPT|STATIC_RX_BUFFER_NUM" firmware/sdkconfig || true
          B=firmware/build; R=mothership; mkdir -p $R
          cp $B/bootloader/bootloader.bin $B/partition_table/partition-table.bin $B/ota_data_initial.bin $B/xarm-voice.bin $R/
          cp $B/srmodels/srmodels.bin $R/
          python3 - <<'PY'
          import json, os
          B = "firmware/build"
          fa = json.load(open(f"{B}/flasher_args.json"))
          rows = sorted((int(off, 16), os.path.basename(p)) for off, p in fa["flash_files"].items())
          MODEL = next(l.split(",") for l in open("firmware/partitions.csv") if l.startswith("model"))
          if not any(n == "srmodels.bin" for _, n in rows): rows.append((int(MODEL[3], 16), "srmodels.bin"))
          rows.sort()
          json.dump({"name": "xarm mothership", "version": os.environ["GITHUB_SHA"][:7],
                     "new_install_prompt_erase": True,
                     "builds": [{"chipFamily": "ESP32-S3", "parts": [{"path": n, "offset": o} for o, n in rows]}]},
                    open("mothership/manifest.json", "w"), indent=2)
          with open("mothership/OFFSETS.txt", "w") as f:
              for o, n in rows: f.write(f"0x{o:06x}  {n}\n")
          print(open("mothership/OFFSETS.txt").read())
          PY
          ls -la mothership
      - uses: actions/upload-artifact@v4
        with:
          name: mothership
          path: mothership/

  # phone flasher page with both boards' files baked in -> https://jobot101.github.io/xarm/
  pages:
    needs: [firmware, camera, mothership]
    concurrency: { group: gh-pages, cancel-in-progress: false }
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with: { name: release, path: release }
      - uses: actions/download-artifact@v4
        with: { name: camera, path: camera }
      - uses: actions/download-artifact@v4
        with: { name: mothership, path: mothership }
      - name: keep the solenoid files (published separately by solenoid.yml)
        run: mkdir -p keep && git fetch -q --depth 1 origin gh-pages && (git archive FETCH_HEAD sol | tar -x -C keep || true)
      # fw/johnny/ is the old name of MotherShip's channel: the same files, so boards and flashers still on it move over
      - name: build flasher page
        working-directory: flasher
        run: |
          npm ci && npm run build
          mkdir -p dist/fw dist/cam dist/sol && cp ../release/* dist/fw/ && mkdir -p dist/fw/mothership dist/fw/johnny && cp ../mothership/* dist/fw/mothership/ && cp ../mothership/* dist/fw/johnny/ && cp -r ../camera/* dist/cam/ && (cp ../keep/sol/* dist/sol/ 2>/dev/null || true)
      - name: publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: flasher/dist
          force_orphan: true
